<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat de Comunicados - FICCT</title>
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            background: #f5f7fb;
        }

        .chat-container {
            max-width: 960px;
            margin: 40px auto;
        }

        .chat-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            background: #ffffff;
        }

        .chat-header {
            background: linear-gradient(135deg,#2563eb,#06b6d4);
            color: #fff;
            padding: 20px 24px;
        }

        .chat-header h3 {
            margin: 0;
            font-weight: 600;
        }

        .chat-header small {
            opacity: .9;
        }

        .message-area {
            max-height: 480px;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }

        .bubble-user, .bubble-bot {
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            display: inline-block;
            max-width: 100%;
            white-space: pre-wrap;
        }

        .bubble-user {
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .bubble-bot {
            background: #e5e7eb;
            color: #111827;
            border-bottom-left-radius: 4px;
        }

        .message-row {
            margin-bottom: 12px;
        }

        .message-row.user {
            text-align: right;
        }

        .message-row.bot {
            text-align: left;
        }

        .platform-card {
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .platform-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .spinner-overlay {
            display: none;
            align-items: center;
            gap: 8px;
        }

        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
        }

        .results-section {
            border-top: 1px solid #e5e7eb;
            padding: 16px 20px 20px;
            background: #ffffff;
        }

        .media-preview img,
        .media-preview video {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
        }

        .user-info-badge span {
            font-size: 0.8rem;
        }

        .logout-link {
            font-size: 0.75rem;
            color: #e5e7eb;
            text-decoration: underline;
            cursor: pointer;
            opacity: .85;
        }

        .logout-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="card chat-card">
        <div class="chat-header d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-1">Chat de Comunicados</h3>
                <small>Describe el comunicado y te genero textos para cada red.</small>
            </div>
            <div class="d-flex flex-column text-end user-info-badge">
                <span class="badge bg-light text-dark mb-1" id="userLabel">Usuario: —</span>
                <span class="badge bg-dark text-white" id="clienteLabel">Cliente ID: —</span>
                <!-- opcional: logout -->
                <span class="logout-link mt-1" id="logoutLink">Cerrar sesión</span>
            </div>
        </div>

        <!-- Zona de mensajes -->
        <div id="chatWindow" class="message-area">
            <!-- Los mensajes se insertan por JavaScript -->
        </div>

        <!-- Formulario de entrada -->
        <div class="p-3 border-top bg-white">
            <form id="promptForm" class="row gy-2 align-items-end">
                <div class="col-12 col-md-9">
                    <label for="promptInput" class="form-label mb-1">¿Qué comunicado quieres generar?</label>
                    <textarea
                        id="promptInput"
                        class="form-control"
                        rows="2"
                        placeholder="Ej: Comienza el semestre 1-2026 en la UAGRM y la FICCT, #ficct, uagrm, tópicos"
                        required
                    ></textarea>
                </div>
                <div class="col-12 col-md-3 text-md-end">
                    <button type="submit" id="sendBtn" class="btn btn-primary w-100 mt-3 mt-md-0">
                        Generar
                    </button>
                </div>
            </form>

            <!-- Spinner / círculo de carga -->
            <div id="loadingSpinner" class="spinner-overlay mt-2">
                <div class="spinner-border text-primary" role="status"></div>
                <span class="text-muted small">Generando comunicados, por favor espera…</span>
            </div>
        </div>

        <!-- Resultados estructurados por red -->
        <div id="resultsSection" class="results-section">
            <h6 class="mb-3 text-muted">Resultados de la última consulta</h6>
            <div id="resultsContainer" class="row g-3">
                <!-- Tarjetas de plataformas se generan por JS -->
            </div>

            <!-- Imagen y Video generados -->
            <div id="mediaSection" class="media-preview mt-3">
                <!-- Imagen/video generados se insertan por JS -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const form = document.getElementById('promptForm');
    const promptInput = document.getElementById('promptInput');
    const chatWindow = document.getElementById('chatWindow');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const sendBtn = document.getElementById('sendBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const mediaSection = document.getElementById('mediaSection');
    const userLabel = document.getElementById('userLabel');
    const clienteLabel = document.getElementById('clienteLabel');
    const logoutLink = document.getElementById('logoutLink');

    const authToken   = localStorage.getItem('authToken');
    const authUser    = localStorage.getItem('authUser');
    const clienteIdLS = localStorage.getItem('clienteId');

    // =============== MOSTRAR DATOS DEL LOGIN EN EL HEADER ===============
    document.addEventListener("DOMContentLoaded", () => {
        if (!authToken) {
            window.location.href = "/login-ui";
            return;
        }

        if (authUser) {
            userLabel.textContent = "Usuario: " + authUser;
        }

        if (clienteIdLS) {
            clienteLabel.textContent = "Cliente ID: " + clienteIdLS;
        }
    });

    // =============== LOGOUT (limpia localStorage y va al login) ===============
    logoutLink.addEventListener("click", () => {
        localStorage.removeItem('authToken');
        localStorage.removeItem('authUser');
        localStorage.removeItem('clienteId');
        window.location.href = "/login-ui";
    });

    function appendUserMessage(text) {
        const row = document.createElement('div');
        row.className = 'message-row user';
        row.innerHTML = '<div class="bubble-user">' + escapeHtml(text) + '</div>';
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function appendBotMessage(htmlContent) {
        const row = document.createElement('div');
        row.className = 'message-row bot';
        const bubble = document.createElement('div');
        bubble.className = 'bubble-bot';
        bubble.innerHTML = htmlContent;
        row.appendChild(bubble);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function escapeHtml(unsafe) {
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Normaliza rutas tipo "videos\\archivo.mp4" -> "/videos/archivo.mp4"
    function normalizePath(path) {
        if (!path) return null;
        // Si ya es URL completa
        if (path.startsWith('http://') || path.startsWith('https://')) {
            return path;
        }
        let p = path.replace(/\\\\/g, '/').replace(/\\/g, '/');
        if (!p.startsWith('/')) {
            p = '/' + p;
        }
        return p;
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const promptText = promptInput.value.trim();

        if (!promptText) return;

        if (!authToken) {
            appendBotMessage('<span class="text-danger">No hay sesión activa. Inicia sesión nuevamente.</span>');
            return;
        }

        const clienteId = clienteIdLS || "0";

        // Agregar mensaje del usuario al chat
        appendUserMessage(promptText);

        // Limpiar campos visuales de resultados previos
        resultsContainer.innerHTML = '';
        mediaSection.innerHTML = '';

        // Mostrar spinner
        loadingSpinner.style.display = 'flex';
        sendBtn.disabled = true;

        try {
            const response = await fetch('/chatpublicaciones', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + authToken
                },
                body: JSON.stringify({
                    Body: promptText,
                    cliente_id: clienteId
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Error en la solicitud');
            }

            const publicaciones = data.publicaciones || {};
            const status = data.status || {};

            // --------- Chat (texto resumido) ----------
            let resumen = '';
            const redes = ['facebook', 'instagram', 'linkedin', 'tiktok', 'whatsapp'];
            redes.forEach(r => {
                if (publicaciones[r] && publicaciones[r].response) {
                    resumen += '<strong>' + r.toUpperCase() + ':</strong> ' +
                        escapeHtml(publicaciones[r].response) + '<br><br>';
                }
            });
            appendBotMessage(resumen || 'No se recibieron publicaciones.');

            // --------- Tarjetas por red ----------
            resultsContainer.innerHTML = '';
            redes.forEach(r => {
                if (publicaciones[r] && publicaciones[r].response) {
                    const col = document.createElement('div');
                    col.className = 'col-12 col-md-6';

                    const card = document.createElement('div');
                    card.className = 'card platform-card h-100';

                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body';

                    // Encabezado
                    const titleRow = document.createElement('div');
                    titleRow.className = 'd-flex justify-content-between align-items-center mb-2';

                    const title = document.createElement('h6');
                    title.className = 'mb-0';
                    title.innerText = r.charAt(0).toUpperCase() + r.slice(1);

                    const badge = document.createElement('span');
                    badge.className = 'badge bg-secondary platform-badge';
                    badge.innerText = 'Publicación';

                    titleRow.appendChild(title);
                    titleRow.appendChild(badge);

                    const text = document.createElement('p');
                    text.className = 'mb-2';
                    text.innerText = publicaciones[r].response;

                    cardBody.appendChild(titleRow);
                    cardBody.appendChild(text);

                    // Link del perfil si viene en status.urls
                    if (status.urls && status.urls[r]) {
                        const link = document.createElement('a');
                        link.href = status.urls[r];
                        link.target = '_blank';
                        link.className = 'btn btn-outline-primary btn-sm';
                        link.innerText = 'Ver perfil / publicación';
                        cardBody.appendChild(link);
                    }

                    card.appendChild(cardBody);
                    col.appendChild(card);
                    resultsContainer.appendChild(col);
                }
            });

            // --------- Imagen y video generados ----------
            let mediaHtml = '';

            // IMAGEN: usar status.image_url.local_path preferentemente
            let imageSrc = null;
            if (status.image_url && status.image_url.local_path) {
                imageSrc = status.image_url.local_path;
            } else if (status.generated_image && status.generated_image.public_url) {
                imageSrc = status.generated_image.public_url;
            }

            if (imageSrc) {
                mediaHtml += `
                    <div class="mb-3">
                        <h6 class="text-muted mb-1">Imagen generada</h6>
                        <img src="${imageSrc}" alt="Imagen generada">
                    </div>
                `;
            }

            // VIDEO: usar status.video_url.local_path, normalizando
            let videoSrc = null;
            if (status.video_url && status.video_url.local_path) {
                videoSrc = normalizePath(status.video_url.local_path);
            } else if (status.generated_video && status.generated_video.public_url) {
                videoSrc = status.generated_video.public_url;
            }

            if (videoSrc) {
                mediaHtml += `
                    <div class="mb-1">
                        <h6 class="text-muted mb-1">Video generado</h6>
                        <video controls>
                            <source src="${videoSrc}" type="video/mp4">
                            Tu navegador no soporta la reproducción de video.
                        </video>
                    </div>
                `;
            }

            mediaSection.innerHTML = mediaHtml;

        } catch (err) {
            console.error(err);
            appendBotMessage('<span class="text-danger">Ocurrió un error: ' + escapeHtml(err.message) + '</span>');
        } finally {
            loadingSpinner.style.display = 'none';
            sendBtn.disabled = false;
            promptInput.value = '';
            promptInput.focus();
        }
    });
</script>
</body>
</html>
