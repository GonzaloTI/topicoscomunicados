<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Sistema de Publicaciones UAGRM</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px 26px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .login-title {
            font-size: 1.45rem;
            font-weight: 600;
        }

        .login-sub {
            font-size: .9rem;
            color: #6b7280;
        }

        .form-label {
            font-size: .85rem;
        }

        .btn-login {
            font-weight: 600;
        }

        .error-box {
            display: none;
            font-size: .85rem;
        }

        .footer-text {
            font-size: .75rem;
            color: #9ca3af;
        }

    </style>
</head>
<body>

<div class="login-card">
    <h2 class="login-title text-center">Sistema de Publicaciones</h2>
    <p class="login-sub text-center mb-4">UAGRM · FICCT</p>

    <div id="errorBox" class="alert alert-danger error-box"></div>

    <form id="loginForm" autocomplete="off">

        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input
                type="text"
                class="form-control"
                id="username"
                placeholder="Ej: admin, ficct"
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input
                type="password"
                class="form-control"
                id="password"
                placeholder="••••••••"
                required
            >
        </div>

        <div class="mb-3 text-muted small">
            Demo: <code>admin/admin123</code> · <code>ficct/ficct123</code>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary w-100 btn-login">
            <span id="loginBtnText">Ingresar</span>
            <span
                id="loginSpinner"
                class="spinner-border spinner-border-sm ms-2"
                style="display:none;"
            ></span>
        </button>

        <p class="footer-text text-center mt-3">
            © 2025 | FICCT – UAGRM
        </p>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const loginForm   = document.getElementById('loginForm');
    const usernameInp = document.getElementById('username');
    const passwordInp = document.getElementById('password');
    const loginBtn    = document.getElementById('loginBtn');
    const loginText   = document.getElementById('loginBtnText');
    const loginSpin   = document.getElementById('loginSpinner');
    const errorBox    = document.getElementById('errorBox');

    function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent = msg;
    }

    function clearError() {
        errorBox.style.display = 'none';
        errorBox.textContent = '';
    }

    loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        const username = usernameInp.value.trim();
        const password = passwordInp.value.trim();

        if (!username || !password) {
            showError("Por favor ingresa usuario y contraseña.");
            return;
        }

        loginBtn.disabled = true;
        loginSpin.style.display = 'inline-block';
        loginText.textContent = 'Ingresando...';

        try {
            const resp = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await resp.json();

            if (!resp.ok) {
                showError(data.error || 'Error al iniciar sesión');
                return;
            }

            // Guardar token y datos
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('authUser', data.user || username);
            localStorage.setItem('clienteId', data.cliente_id);

            window.location.href = '/';

        } catch (err) {
            console.error(err);
            showError('No se pudo conectar al servidor.');
        } finally {
            loginBtn.disabled = false;
            loginSpin.style.display = 'none';
            loginText.textContent = 'Ingresar';
        }
    });
</script>

</body>
</html>
